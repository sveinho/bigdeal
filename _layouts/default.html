<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Kit-LD</title>
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
</head>
<body>
    <header style="background: #1a1a1a; color: white; padding: 20px;">
        <h1><a href="{{ '/' | relative_url }}" style="color: white; text-decoration: none;">Kit-LD Catalog</a></h1>
    </header>

    <main style="max-width: 900px; margin: 30px auto; padding: 0 20px;">
        <!-- Jekyll injects individual articles or page content here -->
        {{ content }}
    </main>
</body>
</html>
