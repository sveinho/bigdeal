<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local JSON Sections Test</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .section-hero { background: #e0f2fe; padding: 40px; text-align: center; color: #0369a1; }
        .section-info { padding: 20px; max-width: 600px; margin: 20px auto; line-height: 1.6; }
        .section-banner { background: #fef3c7; color: #b45309; padding: 10px; text-align: center; font-weight: bold; border-bottom: 1px solid #f59e0b; }
    </style>
</head>
<body>

    <div id="page-sections">Loading local mock elements...</div>

    <script>
        // Target the local static file instead of Sanity's CDN URL
        const LOCAL_JSON_URL = './data.json';

        async function loadLocalSections() {
            try {
                const response = await fetch(LOCAL_JSON_URL);
                const data = await response.json();
                
                // Keep the exact same logic structure used for Sanity
                const sections = data.result; 

                const container = document.getElementById('page-sections');
                container.innerHTML = ''; 

                sections.forEach(section => {
                    switch(section._type) {
                        case 'hero':
                            container.innerHTML += `
                                <section class="section-hero">
                                    <h1>${section.title}</h1>
                                </section>
                            `;
                            break;
                            
                        case 'banner':
                            container.innerHTML += `
                                <div class="section-banner">
                                    <span>${section.message}</span>
                                </div>
                            `;
                            break;
                            
                        case 'info':
                            container.innerHTML += `
                                <section class="section-info">
                                    <p>${section.text}</p>
                                </section>
                            `;
                            break;
                            
                        default:
                            console.warn('Unknown type:', section._type);
                    }
                });

            } catch (error) {
                console.error('Error reading the local JSON file:', error);
                document.getElementById('page-sections').innerText = 'Failed to load static JSON. Ensure you are running a local web server.';
            }
        }

        loadLocalSections();
    </script>
</body>
</html>
